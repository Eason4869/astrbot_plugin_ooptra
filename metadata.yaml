name: astrbot_plugin_ooptra
display_name: Oopz 语音桥
short_desc: QQ 查 Oopz 语音人数，一键进退语音房
desc: |
  **Ooptra 配套插件**，在 QQ 查询 / 管理 Oopz 语音频道。

  - `/语音状态` 查人数与成员（含闭麦/闭听）
  - `/进语音` `/退语音` 一键进退 Oopz 语音房
  - `/语音绑定` 管理 QQ 群 ↔ Oopz 域/频道映射
  - 可选 LLM 工具，模型可自行查/控语音

  需配合 [Ooptra](https://github.com/Eason4869/Ooptra) 的 VOICE_API 使用。
version: 0.3.0
author: Eason4869
repo: https://github.com/Eason4869/astrbot_plugin_ooptra
homepage: https://github.com/Eason4869/astrbot_plugin_ooptra
social_link: https://github.com/Eason4869
astrbot_version: ">=4.16"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
tags:
  - voice
  - oopz
  - qq
  - onebot
  - tool
